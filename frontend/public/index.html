<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="EntropyHub - Decentralized Randomness Beacon"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Özel stiller -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        overflow-x: hidden;
        background-color: #050b14;
        color: white;
      }
      
      /* Light tema için */
      body.light-theme {
        background-color: #f5f7fa;
        color: #1e293b;
      }
      
      /* Glassmorphism efekti */
      .glass-card {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        background-color: rgba(10, 25, 41, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .light-theme .glass-card {
        background-color: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      
      /* 3D Canvas */
      canvas {
        width: 100% !important;
        height: 100% !important;
        border-radius: 1.5rem;
      }
      
      /* Animasyonlar */
      @keyframes fadeInDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in-down {
        animation: fadeInDown 0.3s ease-out;
      }
      
      .animate-fade-in-up {
        animation: fadeInUp 0.3s ease-out;
      }
      
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      .animate-spin {
        animation: spin 1s linear infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .5; }
      }
      
      .animate-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      
      @keyframes ping {
        75%, 100% {
          transform: scale(2);
          opacity: 0;
        }
      }
      
      .animate-ping {
        animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      
      /* Renk değişkenleri */
      :root {
        --primary: #0A1929;
        --accent: #00FFA3;
      }
      
      /* Özel renk sınıfları */
      .bg-\[\#0A1929\] { background-color: #0A1929; }
      .text-\[\#00FFA3\] { color: #00FFA3; }
      .border-\[\#00FFA3\] { border-color: #00FFA3; }
      .bg-\[\#00FFA3\] { background-color: #00FFA3; }
      .bg-\[\#00FFA3\]\/10 { background-color: rgba(0, 255, 163, 0.1); }
      .bg-\[\#00FFA3\]\/20 { background-color: rgba(0, 255, 163, 0.2); }
      
      /* ===== YENİ EKLENEN STILLER ===== */
      /* İstatistikler ve Çıktı için yan yana düzen */
      .stats-output-row {
        display: grid;
        grid-template-columns: 1fr 1fr;  /* İki eşit sütun */
        gap: 1rem;
        margin-top: 1rem;
      }
      
      /* İstatistik kartları için iç grid */
      .stats-inner-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;  /* Toplam Üretim ve Döngü yan yana */
        gap: 0.75rem;
        margin-top: 0.75rem;
      }
      
      /* Çıktı grid'i için */
      .output-bytes-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);  /* 4 sütunlu byte grid'i */
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      
      /* Responsive: Mobilde alt alta */
      @media (max-width: 768px) {
        .stats-output-row {
          grid-template-columns: 1fr;  /* Tek sütun */
        }
      }
      
      /* Ana grid layout */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;  /* 3 sütun: 25% - 50% - 25% */
        gap: 1.5rem;
      }
      
      @media (max-width: 1024px) {
        .main-grid {
          grid-template-columns: 1fr;  /* Mobilde tek sütun */
        }
      }
      
      /* Layout için grid düzenlemeleri */
      .grid { display: grid; }
      .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
      .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      
      /* Boşluklar */
      .gap-2 { gap: 0.5rem; }
      .gap-4 { gap: 1rem; }
      .gap-6 { gap: 1.5rem; }
      
      /* Padding */
      .p-2 { padding: 0.5rem; }
      .p-3 { padding: 0.75rem; }
      .p-4 { padding: 1rem; }
      .p-6 { padding: 1.5rem; }
      .p-8 { padding: 2rem; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
      .px-8 { padding-left: 2rem; padding-right: 2rem; }
      .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
      .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
      .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
      
      /* Margin */
      .m-0 { margin: 0; }
      .mx-auto { margin-left: auto; margin-right: auto; }
      .mt-2 { margin-top: 0.5rem; }
      .mt-4 { margin-top: 1rem; }
      .mt-6 { margin-top: 1.5rem; }
      .mt-8 { margin-top: 2rem; }
      .mb-2 { margin-bottom: 0.5rem; }
      .mb-3 { margin-bottom: 0.75rem; }
      .mb-4 { margin-bottom: 1rem; }
      .mb-6 { margin-bottom: 1.5rem; }
      
      /* Flex */
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-row { flex-direction: row; }
      .items-center { align-items: center; }
      .justify-between { justify-content: space-between; }
      .justify-center { justify-content: center; }
      
      /* Genişlik */
      .w-full { width: 100%; }
      .w-80 { width: 20rem; }
      .min-h-screen { min-height: 100vh; }
      
      /* Metin */
      .text-xs { font-size: 0.75rem; }
      .text-sm { font-size: 0.875rem; }
      .text-base { font-size: 1rem; }
      .text-lg { font-size: 1.125rem; }
      .text-xl { font-size: 1.25rem; }
      .text-2xl { font-size: 1.5rem; }
      .text-3xl { font-size: 1.875rem; }
      .font-bold { font-weight: 700; }
      .font-mono { font-family: monospace; }
      .text-center { text-align: center; }
      
      /* Kenarlıklar */
      .border { border-width: 1px; border-style: solid; }
      .border-t { border-top-width: 1px; }
      .border-b { border-bottom-width: 1px; }
      .border-gray-700 { border-color: #374151; }
      .border-gray-200 { border-color: #e2e8f0; }
      .border-white\/10 { border-color: rgba(255, 255, 255, 0.1); }
      .border-white\/5 { border-color: rgba(255, 255, 255, 0.05); }
      
      /* Arkaplan */
      .bg-opacity-10 { --tw-bg-opacity: 0.1; }
      .bg-white { background-color: white; }
      .bg-white\/10 { background-color: rgba(255, 255, 255, 0.1); }
      .bg-white\/5 { background-color: rgba(255, 255, 255, 0.05); }
      .bg-black { background-color: black; }
      .bg-black\/20 { background-color: rgba(0, 0, 0, 0.2); }
      .bg-gray-50 { background-color: #F9FAFB; }
      .bg-gray-800 { background-color: #1f2937; }
      .bg-red-500 { background-color: #EF4444; }
      .bg-red-500\/10 { background-color: rgba(239, 68, 68, 0.1); }
      .bg-yellow-500\/10 { background-color: rgba(245, 158, 11, 0.1); }
      
      /* Renk */
      .text-white { color: white; }
      .text-gray-400 { color: #9CA3AF; }
      .text-gray-500 { color: #6B7280; }
      .text-gray-300 { color: #d1d5db; }
      .text-yellow-500 { color: #F59E0B; }
      .text-purple-400 { color: #C084FC; }
      .text-blue-400 { color: #60A5FA; }
      .text-red-400 { color: #f87171; }
      
      /* Yuvarlak kenarlar */
      .rounded { border-radius: 0.25rem; }
      .rounded-lg { border-radius: 0.5rem; }
      .rounded-xl { border-radius: 0.75rem; }
      .rounded-2xl { border-radius: 1rem; }
      .rounded-3xl { border-radius: 1.5rem; }
      .rounded-full { border-radius: 9999px; }
      
      /* Gölge */
      .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
      .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
      .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
      .shadow-\[\#00FFA3\]\/20 { box-shadow: 0 0 20px rgba(0, 255, 163, 0.2); }
      
      /* Overflow */
      .overflow-hidden { overflow: hidden; }
      .relative { position: relative; } 
      .absolute { position: absolute; }
      .fixed { position: fixed; }
      .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
      .top-4 { top: 1rem; }
      .left-4 { left: 1rem; }
      .right-4 { right: 1rem; }
      .top-24 { top: 6rem; }
      .right-8 { right: 2rem; }
      .z-10 { z-index: 10; }
      .z-50 { z-index: 50; }
      
      /* Container */
      .container {
        width: 100%;
        max-width: 1400px;
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }
      
      /* Hover efektleri */
      .hover\:-translate-y-1:hover {
        transform: translateY(-0.25rem);
      }
      
      .hover\:border-\[\#00FFA3\]\/50:hover {
        border-color: rgba(0, 255, 163, 0.5);
      }
      
      .hover\:bg-\[\#00FFA3\]\/5:hover {
        background-color: rgba(0, 255, 163, 0.05);
      }
      
      .transition-all {
        transition-property: all;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 300ms;
      }
      
      .cursor-default {
        cursor: default;
      }
      
      .pointer-events-none {
        pointer-events: none;
      }
      
      /* Backdrop blur */
      .backdrop-blur-xl {
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }
      
      .backdrop-blur-md {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
       
      .backdrop-blur-sm {
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
    </style>
    
    <title>EntropyHub</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
